name: CI

on:
  push:
    branches: [ release, staging ]
  pull_request:
    branches: [ release, staging ]

jobs:
  build:
    name: ${{ matrix.os }} / rust-${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        toolchain: [stable, beta, nightly]
        include:
          - toolchain: stable
            rust_version: stable
          - toolchain: beta
            rust_version: beta
          - toolchain: nightly
            rust_version: nightly

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust_version }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --all-features --locked

      - name: Record Badge Status
        if: always()
        shell: bash
        run: |
          mkdir -p badge-status
          cat <<EOF > "badge-status/status-${{ matrix.os }}-${{ matrix.toolchain }}.json"
          {
            "os": "${{ matrix.os }}",
            "toolchain": "${{ matrix.toolchain }}",
            "status": "${{ job.status }}"
          }
          EOF

      - name: Upload Status Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.os }}-${{ matrix.toolchain }}
          path: badge-status/status-${{ matrix.os }}-${{ matrix.toolchain }}.json

  generate-badges:
    name: Generate SVG Badges
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Determine badge target directory
        id: badge_dir
        shell: bash
        run: |
          if [[ "${GITHUB_REF##*/}" == "staging" ]]; then
            echo "dir=badges-staging" >> "$GITHUB_OUTPUT"
          else
            echo "dir=badges" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all badge status artifacts
        uses: actions/download-artifact@v4
        with:
          path: badge-status
          pattern: status-*
          merge-multiple: true

      - name: Generate SVG badges
        shell: bash
        run: |
          mkdir -p "${{ steps.badge_dir.outputs.dir }}"

          for f in badge-status/*.json; do
            [[ -f "$f" ]] || continue

            os=$(jq -r '.os' "$f")
            toolchain=$(jq -r '.toolchain' "$f")
            status=$(jq -r '.status' "$f")

            color="gray"
            prefix="na"
            symbol="○"

            [[ "$status" == "success"   ]] && { color="green"; prefix="ok";     symbol="✔"; }
            [[ "$status" == "cancelled" ]] && { color="gray";  prefix="na";     symbol="○"; }
            [[ "$status" == "failure"   ]] && { color="red";   prefix="failed"; symbol="✘"; }

            badge_name="${os}-rust-${toolchain}.svg"
            badge="${{ steps.badge_dir.outputs.dir }}/${badge_name}"

            prefix_enc=$(printf '%s' "$prefix" | jq -sRr @uri)
            symbol_enc=$(printf '%s' "$symbol" | jq -sRr @uri)

            curl -fsSL \
              "https://img.shields.io/static/v1?label=${prefix_enc}&message=${symbol_enc}&color=${color}" \
              -o "$badge"
          done

      - name: Upload badge folder to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ steps.badge_dir.outputs.dir }}
          destination_dir: ${{ steps.badge_dir.outputs.dir }}